name: Mobile Rota Swipe Fix

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mobile-rota-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply robust mobile swipe
        shell: python
        run: |
          from pathlib import Path
          p = Path('index (7).html')
          s = p.read_text(encoding='utf-8')
          backup = Path('index (7).html.backup')
          if not backup.exists():
              backup.write_text(s, encoding='utf-8')

          marker = 'LENO MOBILE ROTA SWIPE V2'
          if marker not in s:
              block = r'''\n<style id="leno-mobile-rota-swipe-v2">
/* LENO MOBILE ROTA SWIPE V2 */
@media (max-width:760px){
  .tablewrap{
    display:block!important;
    width:100%!important;
    max-width:100%!important;
    overflow-x:scroll!important;
    overflow-y:visible!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior-x:contain!important;
    touch-action:pan-y!important;
    scrollbar-width:none!important;
  }
  .tablewrap::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
  .rota{
    display:table!important;
    width:auto!important;
    min-width:0!important;
    table-layout:fixed!important;
  }
  .rota th:first-child,.rota td.person{
    position:sticky!important;
    left:0!important;
    z-index:20!important;
    width:175px!important;
    min-width:175px!important;
    max-width:175px!important;
    background:#111318!important;
    box-shadow:8px 0 16px rgba(0,0,0,.18)!important;
  }
  .rota th:first-child{z-index:30!important}
  .rota th:not(:first-child),.rota td:not(.person){
    width:160px!important;
    min-width:160px!important;
    max-width:160px!important;
  }
  .rota th{
    position:sticky!important;
    top:0!important;
    z-index:15!important;
    background:#111318!important;
  }
  .rota th:first-child{z-index:30!important}
  .day{width:160px!important;min-width:160px!important}
}
</style>
<script>
(function(){
  function setupMobileRotaSwipe(){
    if(window.innerWidth>760) return;
    document.querySelectorAll('.tablewrap').forEach(function(el){
      if(el.dataset.swipeReady==='1') return;
      el.dataset.swipeReady='1';
      var startX=0,startY=0,startScroll=0,dragging=false,axis='';
      el.addEventListener('touchstart',function(e){
        if(!e.touches||!e.touches[0]) return;
        startX=e.touches[0].clientX; startY=e.touches[0].clientY;
        startScroll=el.scrollLeft; dragging=true; axis='';
      },{passive:true});
      el.addEventListener('touchmove',function(e){
        if(!dragging||!e.touches||!e.touches[0]) return;
        var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
        if(!axis && (Math.abs(dx)>8 || Math.abs(dy)>8)) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
        if(axis==='x'){
          e.preventDefault();
          el.scrollLeft=startScroll-dx;
        }
      },{passive:false});
      el.addEventListener('touchend',function(){dragging=false;axis='';},{passive:true});
      el.addEventListener('touchcancel',function(){dragging=false;axis='';},{passive:true});
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setupMobileRotaSwipe);
  else setupMobileRotaSwipe();
  window.addEventListener('resize',setupMobileRotaSwipe);
})();
</script>
'''
              s = s.replace('</head>', block + '</head>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "index (7).html" "index (7).html.backup" ".github/workflows/mobile-rota-swipe.yml"
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile rota swipe navigation"
          git push
