name: LENO Mobile Rota V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DOM-ready rota controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index (7).html')
          s=p.read_text(encoding='utf-8')
          marker='LENO_MOBILE_ROTA_V7'
          if marker in s:
              raise SystemExit('V7 already present')
          css='''<style id="leno-mobile-rota-v7">/* LENO_MOBILE_ROTA_V7 */\n@media(max-width:760px){.tablewrap.leno-mobile-scroll{touch-action:pan-x!important;overflow-x:scroll!important;overflow-y:hidden!important}.leno-rota-controls{display:flex!important;align-items:center;gap:8px;padding:8px 10px;background:#111318;border-bottom:1px solid #262a31}.leno-rota-controls button{width:42px;height:36px;border:1px solid #343941;border-radius:9px;background:#1b1f26;color:#fff;font-size:22px;font-weight:800}.leno-rota-controls .label{flex:1;text-align:center;font-size:10px;color:#9ca3af;font-weight:700}.leno-rota-controls button:disabled{opacity:.35}}\n@media(min-width:761px){.leno-rota-controls{display:none!important}}</style>'''
          js='''<script id="leno-mobile-rota-v7">/* LENO_MOBILE_ROTA_V7 */\n(function(){function boot(){document.querySelectorAll('.tablewrap').forEach(function(w){if(w.dataset.lenoV7)return;var table=w.querySelector('.rota');if(!table)return;w.dataset.lenoV7='1';w.classList.add('leno-mobile-scroll');var c=document.createElement('div');c.className='leno-rota-controls';c.innerHTML='<button type="button" class="v7prev">‹</button><div class="label">SWIPE FOR MORE DAYS</div><button type="button" class="v7next">›</button>';w.parentNode.insertBefore(c,w);var p=c.querySelector('.v7prev'),n=c.querySelector('.v7next');function refresh(){var max=Math.max(0,w.scrollWidth-w.clientWidth);p.disabled=w.scrollLeft<2;n.disabled=w.scrollLeft>max-2}p.onclick=function(){w.scrollBy({left:-Math.max(280,w.clientWidth*.75),behavior:'smooth'})};n.onclick=function(){w.scrollBy({left:Math.max(280,w.clientWidth*.75),behavior:'smooth'})};w.addEventListener('scroll',refresh,{passive:true});refresh();});}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){boot();new MutationObserver(boot).observe(document.body,{childList:true,subtree:true})});else{boot();new MutationObserver(boot).observe(document.body,{childList:true,subtree:true})}})();</script>'''
          s=s.replace('</head>',css+'\n'+js+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'index (7).html'
          git commit -m "Make iPhone rota scrolling reliable" || echo "No changes"
          git push
