name: LENO Mobile Rota V5

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-rota-v5.yml'
      - 'index (7).html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'index (7).html'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix iPhone rota horizontal swiping'
          git push
